%YAML 1.2
---
$id: http://devicetree.org/schemas/net/qcom,stmmac-ethqos.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics 10/100/1000 Ethernet driver (GMAC)

maintainers:
    - Jinesh Jayakumar <quic_jineshk@quicinc.com>

properties:
  compatible:
    enum:
      - qcom,stmmac-ethqos
      - st,spear600-gmac # For backwards compatibility

  reg:
    description: Address and length of the register set for the device.

  interrupts: # List of STMMAC interrupts
    items:
      - description: Combined signal for various interrupt events.
      - description: Interrupt to manage the remote wake-up packet detection.
      - description: Interrupt that occurs when Tx or Rx enters/exits LPI state.

  interrupt-names:
    items:
      - const: "macirq"
      - const: "eth_wake_irq"
      - const: "eth_lpi"

  phy-mode:
    description: See ethernet.txt file in the same directory.

  snps,reset-gpio:
    description: GPIO number for phy reset.

  snps,reset-active-low:
    deprecated: true
    $ref: /schemas/types.yaml#/definitions/flag
    description: Flag to indicate if phy reset is active low.

  snps,reset-delays-us:
    deprecated: true
    description:
      Triplet of delays. The 1st cell is reset pre-delay in micro
      seconds. The 2nd cell is reset pulse in micro seconds. The 3rd
      cell is reset post-delay in micro seconds.

#optional:
  resets:
    description: Phandle to the STMMAC reset signal, if any.

  reset-names:
    const: "stmmaceth"

  max-frame-size:
    description: See ethernet.txt file in the same directory.

  clocks:
    additionalItems: true
    items:
      - description: GMAC main clock.
      - description: Peripheral's register interface clock.
      - description:
          PTP reference clock. This clock is used for programming the
          Timestamp Addend Register. If not passed then the system
          clock will be used and this is fine on some platforms.

  clock-names:
    additionalItems: true
    contains:
      enum:
        - stmmaceth
        - pclk
        - ptp_ref

  tx-fifo-depth:
    description: See ethernet.txt file in the same directory.

  rx-fifo-depth:
    description: See ethernet.txt file in the same directory.

  snps,pbl:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Programmable Burst Length (tx and rx).

  snps,txpbl:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Tx Programmable Burst Length. Only for GMAC and newer.
                 If set, DMA tx will use this value rather than snps,pbl.

  snps,rxpbl:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Rx Programmable Burst Length. Only for GMAC and newer.
                 If set, DMA rx will use this value rather than snps,pbl.

  snps,no-pbl-x8:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Don't multiply the pbl/txpbl/rxpbl values by 8.
                 For core rev < 3.50, don't multiply the values by 4.

  snps,aal:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Address-Aligned Beats.

  snps,fixed-burst:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Program the DMA to use the fixed burst mode.

  snps,mixed-burst:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Program the DMA to use the mixed burst mode.

  snps,force_thresh_dma_mode:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Force DMA to use the threshold mode for both tx and rx.

  snps,force_sf_dma_mode:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Force DMA to use the Store and Forward mode for both tx and rx.
                 This flag is ignored if force_thresh_dma_mode is set.

  snps,en-tx-lpi-clockgating:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Enable gating of the MAC TX clock during TX low-power mode.

  snps,multicast-filter-bins:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of multicast filter hash bins supported by this device instance.

  snps,perfect-filter-entries:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of perfect filter entries supported by this device instance.

  snps,ps-speed:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Port selection speed that can be passed to the core when PCS is supported.
      For example, this is used in case of SGMII and MAC2MAC connection.

  snps,tso:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Enables the TSO feature (only for GMAC4 and newer).

  mdio:
    $ref: mdio.yaml#
    unevaluatedProperties: false
    description:
      Creates and registers an MDIO bus.

    properties:
      compatible:
        const: snps,dwmac-mdio

    required:
      - compatible

  qcom,arm-smmu:
    type: boolean
    description: If present enables EMAC SMMU support in sdxpoorwills.

#list of parameters to program the AXI register inside the DMA module
  snps,lpi_en:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Enable Low Power Interface.

  snps,xit_frm:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Unlock on WoL.

  snps,wr_osr_lmt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Max write outstanding req. limit.

  snps,rd_osr_lmt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Max read outstanding req. limit.

  snps,kbbe:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Do not cross 1KiB boundary.

  snps,blen:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Vector of supported burst length.

  snps,fb:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Fixed-burst.

  snps,mb:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Mixed-burst.

  snps,rb:
    $ref: /schemas/types.yaml#/definitions/flag
    description: Rebuild INCRx Burst.

  snps,mtl-rx-config:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Multiple RX Queues parameters. Phandle to a node that
      implements the 'rx-queues-config' object described in
      this binding.

  rx-queues-config:
    type: object
    properties:
      snps,rx-queues-to-use:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: number of RX queues to be used in the driver
      snps,rx-sched-sp:
        type: boolean
        description: Strict priority
      snps,rx-sched-wsp:
        type: boolean
        description: Weighted Strict priority
    allOf:
      - if:
          required:
            - snps,rx-sched-sp
        then:
          properties:
            snps,rx-sched-wsp: false
      - if:
          required:
            - snps,rx-sched-wsp
        then:
          properties:
            snps,rx-sched-sp: false
    patternProperties:
      "^queue[0-9]$":
        description: Each subnode represents a queue.
        type: object
        properties:
          snps,dcb-algorithm:
            type: boolean
            description: Queue to be enabled as DCB
          snps,avb-algorithm:
            type: boolean
            description: Queue to be enabled as AVB
          snps,map-to-dma-channel:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: DMA channel id to map
          snps,route-avcp:
            type: boolean
            description: AV Untagged Control packets
          snps,route-ptp:
            type: boolean
            description: PTP Packets
          snps,route-dcbcp:
            type: boolean
            description: DCB Control Packets
          snps,route-up:
            type: boolean
            description: Untagged Packets
          snps,route-multi-broad:
            type: boolean
            description: Multicast & Broadcast Packets
          snps,priority:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            maxItems: 1
            description: Bitmask of the tagged frames priorities assigned to the queue
        allOf:
          - if:
              required:
                - snps,dcb-algorithm
            then:
              properties:
                snps,avb-algorithm: false
          - if:
              required:
                - snps,avb-algorithm
            then:
              properties:
                snps,dcb-algorithm: false
          - if:
              required:
                - snps,route-avcp
            then:
              properties:
                snps,route-ptp: false
                snps,route-dcbcp: false
                snps,route-up: false
                snps,route-multi-broad: false
          - if:
              required:
                - snps,route-ptp
            then:
              properties:
                snps,route-avcp: false
                snps,route-dcbcp: false
                snps,route-up: false
                snps,route-multi-broad: false
          - if:
              required:
                - snps,route-dcbcp
            then:
              properties:
                snps,route-avcp: false
                snps,route-ptp: false
                snps,route-up: false
                snps,route-multi-broad: false
          - if:
              required:
                - snps,route-up
            then:
              properties:
                snps,route-avcp: false
                snps,route-ptp: false
                snps,route-dcbcp: false
                snps,route-multi-broad: false
          - if:
              required:
                - snps,route-multi-broad
            then:
              properties:
                snps,route-avcp: false
                snps,route-ptp: false
                snps,route-dcbcp: false
                snps,route-up: false
        additionalProperties: false
    additionalProperties: false

  snps,mtl-tx-config:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Multiple TX Queues parameters. Phandle to a node that
      implements the 'tx-queues-config' object described in
      this binding.

  tx-queues-config:
    type: object
    properties:
      snps,tx-queues-to-use:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: number of TX queues to be used in the driver
      snps,tx-sched-wrr:
        type: boolean
        description: Weighted Round Robin
      snps,tx-sched-wfq:
        type: boolean
        description: Weighted Fair Queuing
      snps,tx-sched-dwrr:
        type: boolean
        description: Deficit Weighted Round Robin
      snps,tx-sched-sp:
        type: boolean
        description: Strict priority
    allOf:
      - if:
          required:
            - snps,tx-sched-wrr
        then:
          properties:
            snps,tx-sched-wfq: false
            snps,tx-sched-dwrr: false
      - if:
          required:
            - snps,tx-sched-wfq
        then:
          properties:
            snps,tx-sched-wrr: false
            snps,tx-sched-dwrr: false
      - if:
          required:
            - snps,tx-sched-dwrr
        then:
          properties:
            snps,tx-sched-wrr: false
            snps,tx-sched-wfq: false
    patternProperties:
      "^queue[0-9]$":
        description: Each subnode represents a queue.
        type: object
        properties:
          snps,weight:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: TX queue weight (if using a DCB weight algorithm)
          snps,dcb-algorithm:
            type: boolean
            description: TX queue will be working in DCB
          snps,avb-algorithm:
            type: boolean
            description:
              TX queue will be working in AVB.
              Queue 0 is reserved for legacy traffic and so no AVB is
              available in this queue.
          snps,send_slope:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: enable Low Power Interface
          snps,idle_slope:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: unlock on WoL
          snps,high_credit:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: max write outstanding req. limit
          snps,low_credit:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: max read outstanding req. limit
          snps,priority:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            maxItems: 1
            description:
              Bitmask of the tagged frames priorities assigned to the queue.
              When a PFC frame is received with priorities matching the bitmask,
              the queue is blocked from transmitting for the pause time specified
              in the PFC frame.

        allOf:
          - if:
              required:
                - snps,dcb-algorithm
            then:
              properties:
                snps,avb-algorithm: false
          - if:
              required:
                - snps,avb-algorithm
            then:
              properties:
                snps,dcb-algorithm: false
                snps,weight: false
        additionalProperties: false
    additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - phy-mode

dependencies:
  snps,reset-active-low: ["snps,reset-gpio"]
  snps,reset-delay-us: ["snps,reset-gpio"]

additionalProperties: true

examples:
  - |
        stmmac_axi_setup: stmmac-axi-config {
            snps,wr_osr_lmt = <0xf>;
            snps,rd_osr_lmt = <0xf>;
            snps,blen = <256 128 64 32 0 0 0>;
        };

        mtl_rx_setup: rx-queues-config {
            snps,rx-queues-to-use = <1>;
            snps,rx-sched-sp;
            queue0 {
                snps,dcb-algorithm;
                snps,map-to-dma-channel = <0x0>;
                snps,priority = <0x0>;
            };
        };

        mtl_tx_setup: tx-queues-config {
            snps,tx-queues-to-use = <2>;
            snps,tx-sched-wrr;
            queue0 {
                snps,weight = <0x10>;
                snps,dcb-algorithm;
                snps,priority = <0x0>;
            };

            queue1 {
                snps,avb-algorithm;
                snps,send_slope = <0x1000>;
                snps,idle_slope = <0x1000>;
                snps,high_credit = <0x3E800>;
                snps,low_credit = <0xFFC18000>;
                snps,priority = <0x1>;
            };
        };

        gmac0: ethernet@e0800000 {
            compatible = "st,spear600-gmac";
            reg = <0xe0800000 0x8000>;
            interrupt-parent = <&vic1>;
            interrupts = <24 23 22>;
            interrupt-names = "macirq", "eth_wake_irq", "eth_lpi";
            mac-address = [000000000000]; /* Filled in by U-Boot */
            max-frame-size = <3800>;
            phy-mode = "gmii";
            snps,multicast-filter-bins = <256>;
            snps,perfect-filter-entries = <128>;
            rx-fifo-depth = <16384>;
            tx-fifo-depth = <16384>;
            clocks = <&clock>;
            clock-names = "stmmaceth";
            snps,axi-config = <&stmmac_axi_setup>;
            mdio0 {
                #address-cells = <1>;
                #size-cells = <0>;
                compatible = "snps,dwmac-mdio";
                phy1: ethernet-phy@0 {
                };
            };
            snps,mtl-rx-config = <&mtl_rx_setup>;
            snps,mtl-tx-config = <&mtl_tx_setup>;
        };
        ethqos_hw1: qcom,emac0@23040000 {
            compatible = "qcom,stmmac-ethqos",
            qcom,arm-smmu;
        };
