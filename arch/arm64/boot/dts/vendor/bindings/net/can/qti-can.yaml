%YAML 1.2
---
$id: http://devicetree.org/schemas/net/can/qti-can.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QTI CAN driver to interact with external MCU over SPI communication.

maintainers:
  - Rajesh Raturi <rraturi@qti.qualcomm.com>
description:
   The qti-can driver supports CAN communications between MCU and SOC using Socket CAN.

required:
  - compatible
  - reg
  - interrupt-parent
  - interrupts
  - spi-max-frequency
  - qcom,clk-freq-mhz
  - qcom,max-can-channels

properties:
  compatible:
    enum:
      - "qcom,renesas,rh850"
      - "qcom,nxp,mpc5746c"
  reg:
    description: Should contain SPI chip select.
    maxItems: 1
  interrupts:
    description: Should contain IRQ line for the CAN controller.
    maxItems: 1
  spi-max-frequency:
    description: Should contain maximum SPI clock frequency for slave device.
  qcom,clk-freq-mhz:
    description: The frequency at which the CAN clock should be configured.
  qcom,max-can-channels:
    description: Maximum number of CAN channels supported by the controller.
    maxItems: 1
  qcom,bits-per-word:
    description: Indicate how many bits are in a SPI frame. Default to 16.
    default: 16
  qcom,support-can-fd:
    description: Whether CAN FD mode is supported or not.
    maxItems: 1
  qcom,timestamp-conf:
    description: Timestamp source configuration
    maxItems: 1
  qcom,rem-all-buffering-timeout-ms:
    description: The duration after which timeout will happen if we don't get a response from the firmware while trying to remove all the buffered frames IDs from flash.
    maxItems: 1

unevaluatedProperties: false

examples:
  - |
     can-controller@0 {
         compatible = "qcom,nxp,mpc5746c";
         reg = <0>;
         interrupt-parent = <&tlmm>;
         interrupts = <100 0>;
         spi-max-frequency = <5000000>;
         qcom,clk-freq-mhz = <40000000>;
         qcom,max-can-channels = <1>;
         qcom,bits-per-word = <8>;
         qcom,timestamp-conf = <1>;
         qcom,support-can-fd;
     };