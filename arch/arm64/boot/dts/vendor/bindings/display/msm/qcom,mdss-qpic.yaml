%YAML 1.2
---
$id: "http://devicetree.org/schemas/display/msm/qcom,mdss-qpic.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Qualcomm MDSS QPIC Display Controller

maintainers:
- Pratik Bhaurao Patil <quic_pratikbh@quicinc.com>

description: |
  Qualcomm QPIC display controller used in SDX-based platforms.

properties:
  compatible:
    const: "qcom,mdss_qpic"

  reg:
    minItems: 2
    maxItems: 2
    description: Base addresses and sizes for QPIC and TLMM central.

  reg-names:
    items:
      - const: qpic_base
      - const: tlmm_central_base

  interrupts-extended:
    minItems: 2
    maxItems: 2

  interrupt-names:
    items:
      - const: qpic_irq
      - const: bam_irq

  interconnects:
    minItems: 2
    maxItems: 2
    description: Interconnect path for QPIC to memory.

  interconnect-names:
    items:
      - const: qpic-display-data-bus

  qcom,msm-bus:
    type: boolean
    description: Bandwidth configuration subnode for QPIC

  qcom,panel-name:
    type: boolean
    description: Name of the connected panel.

  vdd-supply:
    description: Phandle to the regulator supply for the QPIC panel.

  qcom,rst-gpio:
    maxItems: 1
    description: GPIO used to reset the panel.

  qcom,cs-gpio:
    maxItems: 1
    description: Chip-select GPIO for the panel.

  qcom,ad8-gpio:
    maxItems: 1
    description: GPIO used for AD[8] line.

  qcom,panel-te-gpio:
    maxItems: 1
    description: Tearing effect (TE) GPIO from the panel.

  clocks:
    maxItems: 1
    description: Clock for QPIC core.

  clock-names:
    items:
      - const: core_clk

  pinctrl-names:
    items:
      - const: qpic_display_default
      - const: qpic_display_sleep

  pinctrl-0:
    description: Active state pin configuration.

  pinctrl-1:
    description: Sleep state pin configuration.

  nvmem-cells:
    maxItems: 1
    description: Reference to boot_config NVMEM cell.

  nvmem-cell-names:
    items:
      - const: boot_conf

  boot_dev_bits:
    type: boolean
    description: Number of bits used to detect boot device.

  qcom,nand_boot:
    type: boolean
    description: Boot detection values for NAND.

  iommus:
    maxItems: 1
    description: Reference to SMMU with stream ID and mask.

  qcom,iommu-dma:
    type: boolean
    description: IOMMU DMA mode.

  dma-coherent:
    type: boolean

required:
  - compatible
  - reg
  - reg-names
  - interrupts-extended
  - interrupt-names
  - interconnects
  - interconnect-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    &soc {
      mdss_qpic: qcom,msm_qpic@1c98000 {
        compatible = "qcom,mdss_qpic";
        reg = <0x0 0x1c98000 0x0 0x24000>, <0x0 0xf100000 0x0 0x100000>;
        reg-names = "qpic_base", "tlmm_central_base";
        interrupts-extended = <&intc GIC_SPI 75 IRQ_TYPE_LEVEL_HIGH>,
                              <&intc GIC_SPI 135 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "qpic_irq", "bam_irq";
        interconnects = <&system_noc MASTER_QPIC &mc_virt SLAVE_EBI1>,
                        <&system_noc MASTER_QPIC &mc_virt SLAVE_EBI1>;
        interconnect-names = "qpic-display-data-bus";

        qcom,msm-bus {
          name = "mdss_qpic";
          num-cases = <2>;
          num-paths = <1>;
          vectors-KBps = <0 0>, <400000 800000>;
        };

        qcom,panel-name {
          value = "ili_qvga";
        };
        vdd-supply = <&pmx75_l6>;
        qcom,rst-gpio = <&tlmm 99 0>;
        qcom,cs-gpio = <&tlmm 101 0>;
        qcom,ad8-gpio = <&tlmm 100 0>;
        qcom,panel-te-gpio = <&tlmm 98 0>;
        clocks = <&rpmhcc RPMH_QPIC_CLK>;
        clock-names = "core_clk";
        pinctrl-names = "qpic_display_default", "qpic_display_sleep";
        pinctrl-0 = <&qpic_cs_active &qpic_te_active &qpic_rs_active &qpic_ad_active>;
        pinctrl-1 = <&qpic_cs_sleep &qpic_te_sleep &qpic_rs_sleep &qpic_ad_sleep>;
        nvmem-cells = <&boot_config>;
        nvmem-cell-names = "boot_conf";
        qcom,boot_dev_bits {
          value = <0x4>;
        };
        qcom,nand_boot {
          values = <0x0 0x4 0x5>;
        };
        iommus = <&apps_smmu 0x100 0x3>;
        qcom,iommu-dma {
          mode = "atomic";
        };
        dma-coherent;
      };
    };

